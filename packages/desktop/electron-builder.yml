appId: com.musetric.desktop
electronVersion: 43.1.1
directories:
  output: build
  buildResources: gen-assets
beforePack: ./scripts/beforePack.ts
publish:
  provider: github
  owner: musetric
  repo: musetric
electronUpdaterCompatibility: '>=2.15'
win:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  icon: gen-assets/icon.png
  target: nsis
nsis:
  include: installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  license: license.txt
  buildUniversalInstaller: false
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  category: public.app-category.music
linux:
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: musetric
  target: AppImage
  category: Audio
files:
  - dist/**/*
  - package.json
  - '!**/node_modules/@musetric/*/storage/**'
  - '!**/node_modules/@musetric/*/src/**'
  - '!**/node_modules/@musetric/*/scripts/**'
  - '!**/node_modules/@musetric/*/.tsbuildinfo/**'
  - '!**/node_modules/@musetric/*/tsconfig*.json'
  - '!**/node_modules/@musetric/*/eslint.config.ts'
  - '!**/node_modules/@musetric/backend/dist-browser/**'
extraResources:
  - from: ../backend/storage/public
    to: backend/storage/public
  - from: ../backend/dist-browser
    to: backend/dist-browser
  - from: gen-assets/server
    to: server
  - from: ../../license.md
    to: license.md
  - from: ../../thirdPartyNotices.md
    to: thirdPartyNotices.md
  - from: ../../trademark.md
    to: trademark.md
asarUnpack:
  - node_modules/**/*.node
  - node_modules/@musetric/ffmpeg/resources/**
