[package]
name = "musetric-dsp"
description = "Musetric dsp: decoding, resampling, encoding, loudness, peaks, stretch, the renderer of a song and the microphone's ring, natively and in WebAssembly"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
authors = ["Musetric <musetric@gmail.com>"]
repository = "https://github.com/musetric/musetric"
workspace = "../server"

[features]
default = ["opus", "songs", "web-capture", "web-decode", "web-stretch"]
opus = ["dep:symphonia-opus"]
songs = ["symphonia/all"]
web-capture = []
web-decode = []
web-stretch = []

[dependencies]
ebur128 = "=0.1.11"
flacenc = { git = "https://github.com/yotarok/flacenc-rs", rev = "f2ebcf85550ce337ceceed7ba25a1e84c034efc1", default-features = false }
rubato = { version = "=5.1.0", default-features = false, features = ["fft_resampler"] }
rustfft = "=6.4.1"
rusty_aac = "=2.1.2"
rusty_mp3 = "=1.2.0"
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "opt-simd", "pcm", "wav"] }
symphonia-opus = { version = "=0.1.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
