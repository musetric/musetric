[package]
name = "musetric-dsp"
description = "Musetric dsp: decoding, resampling, encoding, loudness, peaks, stretch and the microphone's ring, natively and in WebAssembly"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
authors = ["Musetric <musetric@gmail.com>"]
repository = "https://github.com/musetric/musetric"
workspace = "../server"

[features]
default = ["songs", "web-capture", "web-decode", "web-stretch"]
opus = ["dep:symphonia-adapter-libopus"]
songs = ["symphonia/all"]
web-capture = []
web-decode = []
web-stretch = []

[dependencies]
ebur128 = "=0.1.10"
flacenc = { git = "https://github.com/yotarok/flacenc-rs", rev = "f2ebcf85550ce337ceceed7ba25a1e84c034efc1", default-features = false }
rubato = { version = "=5.0.1", default-features = false, features = ["fft_resampler"] }
rustfft = "=6.4.1"
rusty_aac = "=1.1.0"
rusty_mp3 = "=1.0.0"
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "opt-simd", "pcm", "wav"] }
symphonia-adapter-libopus = { version = "=0.3.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[dev-dependencies]
sha2 = "=0.11.1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[lints]
workspace = true
