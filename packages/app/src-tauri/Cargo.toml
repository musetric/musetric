[package]
name = "musetric-app"
version = "0.1.0"
description = "Musetric — audio separation, transcription and analysis app"
authors = ["Musetric <musetric@gmail.com>"]
license = "MIT"
edition = "2024"
workspace = "../../server"

[lib]
name = "musetric_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
tauri-utils = { version = "=2.10.2", features = ["build-2"] }

[dependencies]
musetric-server = { path = "../../server" }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = [] }
tokio = { version = "=1.53.3", features = ["sync", "time"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
log = "=0.4.34"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-log = "=2.10.1"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-window-state = "=2.5.0"

[lints]
workspace = true
