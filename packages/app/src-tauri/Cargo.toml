[package]
name = "musetric-app"
version = "0.1.0"
description = "Musetric — audio separation, transcription and analysis app"
authors = ["Musetric <musetric@gmail.com>"]
license = "MIT"
edition = "2024"
workspace = "../../server"

[lib]
name = "musetric_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
musetric-server = { path = "../../server" }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "=1.53.1", features = ["sync", "time"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
log = "=0.4.34"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-log = "=2.9.1"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-updater = "=2.11.0"
tauri-plugin-window-state = "=2.4.1"

[lints]
workspace = true
