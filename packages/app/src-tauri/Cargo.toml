[package]
name = "musetric-app"
version = "0.1.0"
description = "Musetric — audio separation, transcription and analysis app"
authors = ["Musetric <musetric@gmail.com>"]
license = "MIT"
edition = "2024"
workspace = "../../server"

[lib]
name = "musetric_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
musetric-server = { path = "../../server" }
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "=1.53.1", features = ["sync", "time"] }

[lints]
workspace = true
