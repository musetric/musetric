[package]
name = "musetric-app"
version = "0.1.0"
description = "Musetric — audio separation, transcription and analysis app"
authors = ["Musetric <musetric@gmail.com>"]
license = "MIT"
edition = "2024"
workspace = "../../server"

[lib]
name = "musetric_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }
tauri-utils = { version = "=2.10.4", features = ["build-2"] }

[dependencies]
musetric-server = { path = "../../server" }
serde_json = "=1.0.154"
tauri = { version = "=2.12.7", features = [] }
tokio = { version = "=1.54.1", features = ["sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.7", features = ["tray-icon"] }
wasapi = "=0.27.0"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
log = "=0.4.35"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-log = "=2.10.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-window-state = "=2.5.0"

[lints]
workspace = true
