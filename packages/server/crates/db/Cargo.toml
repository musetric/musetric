[package]
name = "musetric-db"
description = "Musetric database: schema, migrations and entities"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Musetric <musetric@gmail.com>"]
repository = "https://github.com/musetric/musetric"

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
time = { version = "=0.3.55", features = ["formatting", "macros"] }

[dev-dependencies]
serde_json = "=1.0.151"

[lints]
workspace = true
