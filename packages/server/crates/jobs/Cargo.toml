[package]
name = "musetric-jobs"
description = "Musetric processing queue: steps, progress, failures and events"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
authors = ["Musetric <musetric@gmail.com>"]
repository = "https://github.com/musetric/musetric"

[dependencies]
futures-util = "=0.3.34"
musetric-db = { path = "../db" }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
