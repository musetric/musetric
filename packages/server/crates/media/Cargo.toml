[package]
name = "musetric-media"
description = "Musetric media: the bundled ffmpeg and ffprobe wrappers"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Musetric <musetric@gmail.com>"]
repository = "https://github.com/musetric/musetric"

[dependencies]
ebur128 = "=0.1.10"
flacenc = { version = "=0.5.1", default-features = false }
rubato = { version = "=5.0.0", default-features = false }
serde_json = "=1.0.151"
symphonia = { version = "=0.6.1", features = ["all"] }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "sync"] }

[dev-dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }

[lints]
workspace = true
