[package]
name = "musetric-media"
description = "Musetric media: the host's audio files, read and written through musetric-dsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
authors = ["Musetric <musetric@gmail.com>"]
repository = "https://github.com/musetric/musetric"

[dependencies]
musetric-dsp = { path = "../../../dsp", features = ["opus"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "process", "rt", "sync"] }

[dev-dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread"] }

[lints]
workspace = true
