[package]
name = "musetric-server"
description = "Musetric backend: HTTP API, storage and processing queue"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Musetric <musetric@gmail.com>"]
repository = "https://github.com/musetric/musetric"

[dependencies]
axum = { version = "=0.8.9", features = ["multipart", "ws"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
clap = { version = "=4.6.6", features = ["derive"] }
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "tokio"] }
md5 = "=0.8.1"
musetric-db = { path = "crates/db" }
musetric-jobs = { path = "crates/jobs" }
musetric-media = { path = "crates/media" }
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["formatting", "macros"] }
tokio = { version = "=1.53.1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "=0.7.19", features = ["io"] }
uuid = { version = "=1.26.0", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "=0.29.0"
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true

[workspace]
members = ["crates/*"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
enum_glob_use = "deny"
excessive_nesting = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
shadow_reuse = "deny"
shadow_unrelated = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
type_complexity = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
