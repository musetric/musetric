[package]
name = "musetric-server"
description = "Musetric backend: HTTP API, storage and processing queue"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Musetric <musetric@gmail.com>"]
repository = "https://github.com/musetric/musetric"

[lints]
workspace = true

[workspace]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
