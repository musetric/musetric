name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dev builds artifacts only, release publishes packages/app/package.json version
        type: choice
        options:
          - dev
          - release
        default: dev

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          declared=$(node -p "require('./packages/app/package.json').version")
          if [ "$MODE" = dev ]; then
            echo "version=$declared-dev.g${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$declared" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "not a release version: $declared" >&2
            exit 1
          fi
          case "$declared" in
            *-dev.*)
              echo "dev builds cannot be released: $declared" >&2
              exit 1
              ;;
          esac
          published=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')
          if [ -n "$published" ] && [ "$published" = "$declared" ]; then
            echo "v$declared is already released" >&2
            exit 1
          fi
          if [ -n "$published" ] && [ "$(printf '%s\n%s\n' "${published%%-*}" "${declared%%-*}" | sort -V | tail -1)" != "${declared%%-*}" ]; then
            echo "$declared is older than the published $published" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            rustTarget: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: Windows
            arch: arm64
            rustTarget: aarch64-pc-windows-msvc
          - os: macos-latest
            platform: macOS
            arch: x64
            rustTarget: x86_64-apple-darwin
          - os: macos-latest
            platform: macOS
            arch: arm64
            rustTarget: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.2.0
          package-manager-cache: false
      - run: npm install -g corepack@latest --force
      - run: corepack enable
      - run: corepack prepare yarn@4.17.1 --activate
      - uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn --immutable
        env:
          MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: rustup show
        working-directory: packages/app
      - run: rustup target add ${{ matrix.rustTarget }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/server/target
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('packages/server/rust-toolchain.toml', 'packages/server/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.arch }}-
      - run: yarn workspace @musetric/app pack:installer -- --target ${{ matrix.rustTarget }} --version ${{ needs.prepare.outputs.version }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: musetric-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            packages/server/target/**/release/bundle/nsis/*
            packages/server/target/**/release/bundle/dmg/*
            packages/server/target/**/release/bundle/macos/*

  release:
    if: inputs.mode == 'release'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: musetric-*
          merge-multiple: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.2.0
          package-manager-cache: false
      - run: node packages/app/scripts/assembleUpdateRelease.ts artifacts release ${{ needs.prepare.outputs.version }}
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd release && sha256sum -- *) > SHA256SUMS.txt
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Musetric $VERSION" \
            --generate-notes \
            release/* SHA256SUMS.txt
