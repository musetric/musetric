name: Desktop Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.2.0
          package-manager-cache: false
      - run: npm install -g corepack@latest --force
      - run: corepack enable
      - run: corepack prepare yarn@4.17.1 --activate
      - uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn --immutable
        env:
          MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
          MUSETRIC_SKIP_FFMPEG_FETCH: true
      - run: yarn build:desktop
      - run: yarn workspace @musetric/desktop pack:installer --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: musetric-desktop-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
          path: |
            packages/desktop/build/*.exe
            packages/desktop/build/*.exe.blockmap
            packages/desktop/build/*.dmg
            packages/desktop/build/*.AppImage
