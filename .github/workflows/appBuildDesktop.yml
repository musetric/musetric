name: App Build Desktop

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            rustTarget: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: Windows
            arch: arm64
            rustTarget: aarch64-pc-windows-msvc
          - os: xcode-27
            platform: macOS
            arch: x64
            rustTarget: x86_64-apple-darwin
          - os: xcode-27
            platform: macOS
            arch: arm64
            rustTarget: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: Linux
            arch: x64
            rustTarget: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: Linux
            arch: arm64
            rustTarget: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        if: matrix.platform == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version
      - uses: ./.github/actions/setupYarn
      - uses: actions/cache@v5
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Yarn/Berry/cache' || '~/.yarn/berry/cache' }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn --immutable
        env:
          MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
          ONNXRUNTIME_NODE_INSTALL: skip
      - if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - if: matrix.platform == 'Linux'
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' packages/app/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - if: matrix.platform == 'Linux'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.rustTarget }}
      - if: matrix.platform != 'Linux'
        run: rustup toolchain install --no-self-update
        working-directory: packages/app
      - if: matrix.platform != 'Linux'
        run: rustup target add ${{ matrix.rustTarget }}
        working-directory: packages/app
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/server/target
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('packages/server/rust-toolchain.toml', 'packages/server/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.arch }}-
      - run: rm -rf packages/server/target/*/release/bundle packages/server/target/release/bundle 2>/dev/null
        shell: bash
      - run: yarn workspace @musetric/app pack:installer -- --target ${{ matrix.rustTarget }} --version ${{ inputs.version }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: musetric-desktop-${{ matrix.platform }}-${{ matrix.arch }}-installer
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            packages/server/target/**/release/bundle/nsis/*.exe
            packages/server/target/**/release/bundle/nsis/*.exe.sig
            packages/server/target/**/release/bundle/dmg/*.dmg
            packages/server/target/**/release/bundle/dmg/*.dmg.sig
            packages/server/target/**/release/bundle/macos/*.app.tar.gz
            packages/server/target/**/release/bundle/macos/*.app.tar.gz.sig
            packages/server/target/**/release/bundle/deb/*.deb
            packages/server/target/**/release/bundle/deb/*.deb.sig
      - if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: musetric-desktop-${{ matrix.platform }}-${{ matrix.arch }}-appimage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            packages/server/target/**/release/bundle/appimage/*.AppImage
            packages/server/target/**/release/bundle/appimage/*.AppImage.sig
