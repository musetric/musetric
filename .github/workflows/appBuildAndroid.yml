name: App Build Android

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      publish:
        type: boolean
        required: true
      version:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      MUSETRIC_PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setupYarn
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn --immutable
        env:
          MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
          ONNXRUNTIME_NODE_INSTALL: skip
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/server/target
          key: cargo-${{ runner.os }}-android-${{ hashFiles('packages/server/rust-toolchain.toml', 'packages/server/Cargo.lock', 'packages/app/src-tauri/gen/android/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-android-
      - name: Init Android project
        working-directory: packages/app
        run: yarn init:android
      - name: Pin Android SDK path for gradle
        run: echo "sdk.dir=$ANDROID_HOME" > packages/app/src-tauri/gen/android/local.properties
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'packages/app/src-tauri/gen/android/**/*.gradle.kts', 'packages/app/src-tauri/gen/android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build the release APK and App Bundle (unsigned)
        working-directory: packages/app
        run: |
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          yarn build:android --aab --target aarch64 x86_64 --config "{\"bundle\":{\"android\":{\"versionCode\":$version_code}}}"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
          CARGO_LOG: cargo::core::compiler::fingerprint=info
      - name: Size of the Gradle cache (temporary)
        run: du -sh ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/caches/* 2>/dev/null | sort -h | tail -12
      - name: Name the APK by version
        run: |
          cd packages/app/src-tauri/gen/android/app/build/outputs/apk/universal/release
          mv app-universal-release*.apk "Musetric_${{ inputs.version }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: musetric-android
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: packages/app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: musetric-android-bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: packages/app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab

  google-play:
    if: inputs.mode == 'testing'
    needs: build
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: musetric-android-bundle
          path: unsigned
      - name: Sign with the upload key
        env:
          KEYSTORE: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/upload.p12"
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore"
          alias=$("$JAVA_HOME/bin/keytool" -list -keystore "$keystore" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD \
            | awk -F', ' '/PrivateKeyEntry/ { print $1; exit }')
          test -n "$alias"
          cp unsigned/app-universal-release.aab "$RUNNER_TEMP/musetric.aab"
          "$JAVA_HOME/bin/jarsigner" -keystore "$keystore" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$RUNNER_TEMP/musetric.aab" "$alias"
          rm "$keystore"
          "$JAVA_HOME/bin/jarsigner" -verify "$RUNNER_TEMP/musetric.aab" | grep '^jar verified'
      - name: Upload to Google Play internal testing
        env:
          PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          call() {
            local body arg url=
            for arg in "$@"; do
              case "$arg" in https://*) url=${arg%%\?*} ;; esac
            done
            if ! body=$(curl --silent --show-error --fail-with-body "$@"); then
              printf '%s\n%s\n' "$url" "$body" >&2
              return 1
            fi
            printf '%s' "$body"
          }
          github_token=$(call -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/$PROVIDER" | jq -r .value)
          echo "::add-mask::$github_token"
          federated_token=$(call -X POST https://sts.googleapis.com/v1/token -H 'Content-Type: application/json' \
            -d "$(jq -n --arg audience "//iam.googleapis.com/$PROVIDER" --arg token "$github_token" '{
              grantType: "urn:ietf:params:oauth:grant-type:token-exchange",
              audience: $audience,
              scope: "https://www.googleapis.com/auth/cloud-platform",
              requestedTokenType: "urn:ietf:params:oauth:token-type:access_token",
              subjectTokenType: "urn:ietf:params:oauth:token-type:jwt",
              subjectToken: $token
            }')" | jq -r .access_token)
          echo "::add-mask::$federated_token"
          token=$(call -X POST "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/$SERVICE_ACCOUNT:generateAccessToken" \
            -H "Authorization: Bearer $federated_token" -H 'Content-Type: application/json' \
            -d '{"scope":["https://www.googleapis.com/auth/androidpublisher"]}' | jq -r .accessToken)
          echo "::add-mask::$token"

          app=applications/com.musetric.client
          api=https://androidpublisher.googleapis.com/androidpublisher/v3/$app
          auth="Authorization: Bearer $token"
          edit=$(call -X POST "$api/edits" -H "$auth" -H 'Content-Type: application/json' -d '{}' | jq -r .id)
          bundle=$(call -X POST "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/$app/edits/$edit/bundles?uploadType=media" \
            -H "$auth" -H 'Content-Type: application/octet-stream' --data-binary @"$RUNNER_TEMP/musetric.aab")
          version_code=$(printf '%s' "$bundle" | jq -r .versionCode)
          echo "uploaded version code $version_code, sha256 $(printf '%s' "$bundle" | jq -r .sha256)"
          call -X PUT "$api/edits/$edit/tracks/internal" -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"track\":\"internal\",\"releases\":[{\"versionCodes\":[\"$version_code\"],\"status\":\"completed\"}]}" > /dev/null
          call -X POST "$api/edits/$edit:commit" -H "$auth" -H 'Content-Type: application/json' -d '{}' > /dev/null
          echo "released $version_code to internal testing"
