name: App Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dev builds artifacts only, testing uploads the iOS app to TestFlight, release publishes packages/app/package.json version
        type: choice
        options:
          - dev
          - testing
          - release
        default: dev

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          declared=$(node -p "require('./packages/app/package.json').version")
          if [ "$MODE" != release ]; then
            echo "version=$declared-dev.g${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$declared" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "not a release version: $declared" >&2
            exit 1
          fi
          case "$declared" in
            *-dev.*)
              echo "dev builds cannot be released: $declared" >&2
              exit 1
              ;;
          esac
          published=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')
          if [ -n "$published" ] && [ "$published" = "$declared" ]; then
            echo "v$declared is already released" >&2
            exit 1
          fi
          if [ -n "$published" ] && [ "$(printf '%s\n%s\n' "${published%%-*}" "${declared%%-*}" | sort -V | tail -1)" != "${declared%%-*}" ]; then
            echo "$declared is older than the published $published" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

  desktop:
    if: inputs.mode != 'testing'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            rustTarget: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: Windows
            arch: arm64
            rustTarget: aarch64-pc-windows-msvc
          - os: xcode-27
            platform: macOS
            arch: x64
            rustTarget: x86_64-apple-darwin
          - os: xcode-27
            platform: macOS
            arch: arm64
            rustTarget: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: Linux
            arch: x64
            rustTarget: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: Linux
            arch: arm64
            rustTarget: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        if: matrix.platform == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version
      - uses: ./.github/actions/setupYarn
      - uses: actions/cache@v5
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Yarn/Berry/cache' || '~/.yarn/berry/cache' }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn --immutable
        env:
          MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
          ONNXRUNTIME_NODE_INSTALL: skip
      - if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - if: matrix.platform == 'Linux'
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' packages/app/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - if: matrix.platform == 'Linux'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.rustTarget }}
      - if: matrix.platform != 'Linux'
        run: rustup toolchain install --no-self-update
        working-directory: packages/app
      - if: matrix.platform != 'Linux'
        run: rustup target add ${{ matrix.rustTarget }}
        working-directory: packages/app
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/server/target
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('packages/server/rust-toolchain.toml', 'packages/server/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.arch }}-
      - run: rm -rf packages/server/target/*/release/bundle packages/server/target/release/bundle 2>/dev/null
        shell: bash
      - run: yarn workspace @musetric/app pack:installer -- --target ${{ matrix.rustTarget }} --version ${{ needs.prepare.outputs.version }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: musetric-desktop-${{ matrix.platform }}-${{ matrix.arch }}-installer
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            packages/server/target/**/release/bundle/nsis/*.exe
            packages/server/target/**/release/bundle/nsis/*.exe.sig
            packages/server/target/**/release/bundle/dmg/*.dmg
            packages/server/target/**/release/bundle/dmg/*.dmg.sig
            packages/server/target/**/release/bundle/macos/*.app.tar.gz
            packages/server/target/**/release/bundle/macos/*.app.tar.gz.sig
            packages/server/target/**/release/bundle/deb/*.deb
            packages/server/target/**/release/bundle/deb/*.deb.sig
      - if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: musetric-desktop-${{ matrix.platform }}-${{ matrix.arch }}-appimage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            packages/server/target/**/release/bundle/appimage/*.AppImage
            packages/server/target/**/release/bundle/appimage/*.AppImage.sig

  android:
    if: inputs.mode != 'testing'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64
          - abi: x86_64
            target: x86_64
    runs-on: ubuntu-22.04
    env:
      MUSETRIC_PUBLISH: ${{ inputs.mode == 'release' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setupYarn
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn --immutable
        env:
          MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
          ONNXRUNTIME_NODE_INSTALL: skip
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/server/target
          key: cargo-${{ runner.os }}-android-${{ matrix.target }}-${{ hashFiles('packages/server/rust-toolchain.toml', 'packages/server/Cargo.lock', 'packages/app/src-tauri/gen/android/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-android-${{ matrix.target }}-
      - name: Init Android project
        working-directory: packages/app
        run: yarn init:android
      - name: Pin Android SDK path for gradle
        run: echo "sdk.dir=$ANDROID_HOME" > packages/app/src-tauri/gen/android/local.properties
      - name: Assemble ${{ matrix.abi }} release APK
        working-directory: packages/app
        run: yarn build:android --target ${{ matrix.target }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
      - name: Rename APK with ABI suffix
        run: |
          cd packages/app/src-tauri/gen/android/app/build/outputs/apk/universal/release
          mv app-universal-release*.apk "Musetric_${{ needs.prepare.outputs.version }}_${{ matrix.abi }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: musetric-android-${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: packages/app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  ios:
    needs: prepare
    runs-on: xcode-27
    env:
      MUSETRIC_PUBLISH: ${{ inputs.mode != 'dev' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version
      - uses: ./.github/actions/setupYarn
      - uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn --immutable
        env:
          MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: rustup toolchain install --no-self-update
        working-directory: packages/app
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/server/target
          key: cargo-${{ runner.os }}-ios-${{ hashFiles('packages/server/rust-toolchain.toml', 'packages/server/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-ios-
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Developer/Xcode/DerivedData
          key: ios-xcode-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/app/native/apple/project.yml') }}
          restore-keys: ios-xcode-${{ runner.os }}-
      - run: brew install xcodegen
      - name: Init iOS project
        working-directory: packages/app
        run: yarn init:ios
      - name: Build iOS app (unsigned)
        working-directory: packages/app
        run: |
          bundle_version=$((1000 + GITHUB_RUN_NUMBER))
          yarn build:ios --no-sign --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$bundle_version\"}}}"
      - uses: actions/upload-artifact@v7
        with:
          name: musetric-ios-unsigned
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: packages/app/src-tauri/gen/apple/build/**/*.ipa

  testflight:
    if: inputs.mode == 'testing'
    needs: ios
    runs-on: xcode-27
    environment: app-store
    steps:
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version
      - uses: actions/download-artifact@v8
        with:
          name: musetric-ios-unsigned
          path: unsigned
      - name: Sign for App Store distribution
        env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_APP_STORE_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Apple Distribution: / { print $2; exit }')
          test -n "$identity"

          profile="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          entitlements="$RUNNER_TEMP/entitlements.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$entitlements"
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$entitlements")
          /usr/libexec/PlistBuddy -c 'Delete :keychain-access-groups' "$entitlements" 2> /dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :keychain-access-groups array' -c "Add :keychain-access-groups:0 string $app_id" "$entitlements"

          mkdir "$RUNNER_TEMP/ipa"
          unzip -q unsigned/arm64/Musetric.ipa -d "$RUNNER_TEMP/ipa"
          app="$RUNNER_TEMP/ipa/Payload/Musetric.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          if [ "$bundle_id" != com.musetric.client ] || [ "${app_id#*.}" != "$bundle_id" ]; then
            echo "the app is $bundle_id and the profile is for $app_id" >&2
            exit 1
          fi
          cp "$profile" "$app/embedded.mobileprovision"
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign "$identity" --keychain "$keychain" --timestamp=none {} \;
          fi
          codesign --force --sign "$identity" --keychain "$keychain" --timestamp=none \
            --entitlements "$entitlements" --generate-entitlement-der "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/Musetric.ipa" Payload)
          security delete-keychain "$keychain"
      - name: Upload to TestFlight
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_ID: ${{ vars.APP_STORE_APP_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8
          info="$RUNNER_TEMP/ipa/Payload/Musetric.app/Info.plist"
          read_info() { /usr/libexec/PlistBuddy -c "Print :$1" "$info"; }
          echo "uploading $(read_info CFBundleIdentifier) $(read_info CFBundleShortVersionString) ($(read_info CFBundleVersion))"
          xcrun altool --upload-package "$RUNNER_TEMP/Musetric.ipa" --type ios \
            --apple-id "$APP_ID" \
            --bundle-id "$(read_info CFBundleIdentifier)" \
            --bundle-version "$(read_info CFBundleVersion)" \
            --bundle-short-version-string "$(read_info CFBundleShortVersionString)" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -r ~/.appstoreconnect/private_keys

  release:
    if: inputs.mode == 'release'
    needs:
      - prepare
      - desktop
      - android
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: musetric-*
          merge-multiple: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node packages/app/scripts/assembleUpdateRelease.ts artifacts release ${{ needs.prepare.outputs.version }}
      - name: Copy Android and iOS artifacts into release directory
        run: |
          set -e
          mkdir -p release
          find artifacts/musetric-android-* -name "*.apk" -type f -exec cp -v {} release/ \;
          find artifacts/musetric-ios-* -name "*.ipa" -type f -exec cp -v {} release/ \;
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd release && sha256sum -- *) > SHA256SUMS.txt
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Musetric $VERSION" \
            --generate-notes \
            release/* SHA256SUMS.txt
