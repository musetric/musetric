name: App Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dev builds artifacts only, testing uploads the iOS app to TestFlight and the Android app to Google Play internal testing, release publishes packages/app/package.json version
        type: choice
        options:
          - dev
          - testing
          - release
        default: dev

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: publish
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            testing | release) publish=true ;;
            *) publish=false ;;
          esac
          echo "mode '$MODE' builds with MUSETRIC_PUBLISH=$publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - id: version
        env:
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          declared=$(node -p "require('./packages/app/package.json').version")
          if [ "$MODE" != release ]; then
            echo "version=$declared-dev.g${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$declared" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "not a release version: $declared" >&2
            exit 1
          fi
          case "$declared" in
            *-dev.*)
              echo "dev builds cannot be released: $declared" >&2
              exit 1
              ;;
          esac
          published=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')
          if [ -n "$published" ] && [ "$published" = "$declared" ]; then
            echo "v$declared is already released" >&2
            exit 1
          fi
          if [ -n "$published" ] && [ "$(printf '%s\n%s\n' "${published%%-*}" "${declared%%-*}" | sort -V | tail -1)" != "${declared%%-*}" ]; then
            echo "$declared is older than the published $published" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

  desktop:
    if: inputs.mode != 'testing'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            rustTarget: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: Windows
            arch: arm64
            rustTarget: aarch64-pc-windows-msvc
          - os: xcode-27
            platform: macOS
            arch: x64
            rustTarget: x86_64-apple-darwin
          - os: xcode-27
            platform: macOS
            arch: arm64
            rustTarget: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: Linux
            arch: x64
            rustTarget: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: Linux
            arch: arm64
            rustTarget: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/appBuildDesktop
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          rust-target: ${{ matrix.rustTarget }}
          version: ${{ needs.prepare.outputs.version }}
          tauri-signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri-signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  android:
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      MUSETRIC_PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/appBuildAndroid
        with:
          version: ${{ needs.prepare.outputs.version }}

  ios:
    needs: prepare
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      MUSETRIC_PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/appBuildIos

  testflight:
    if: inputs.mode == 'testing'
    needs: ios
    runs-on: xcode-27
    environment: app-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/uploadTestflight
        with:
          certificate: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          profile: ${{ secrets.APPLE_APP_STORE_PROFILE }}
          api-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          app-id: ${{ vars.APP_STORE_APP_ID }}

  google-play:
    if: inputs.mode == 'testing'
    needs: android
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/uploadGooglePlay
        with:
          keystore: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE }}
          keystore-password: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          workload-identity-provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}

  release:
    if: inputs.mode == 'release'
    needs:
      - prepare
      - desktop
      - android
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: musetric-*
          merge-multiple: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node packages/app/scripts/assembleUpdateRelease.ts artifacts release ${{ needs.prepare.outputs.version }}
      - name: Copy Android and iOS artifacts into release directory
        run: |
          set -e
          mkdir -p release
          find artifacts/musetric-android -name "*.apk" -type f -exec cp -v {} release/ \;
          find artifacts/musetric-ios-* -name "*.ipa" -type f -exec cp -v {} release/ \;
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd release && sha256sum -- *) > SHA256SUMS.txt
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Musetric $VERSION" \
            --generate-notes \
            release/* SHA256SUMS.txt
