name: App Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dev builds artifacts only, testing uploads the iOS app to TestFlight and the Android app to Google Play internal testing, release publishes packages/app/package.json version
        type: choice
        options:
          - dev
          - testing
          - release
        default: dev

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: publish
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            testing | release) publish=true ;;
            *) publish=false ;;
          esac
          echo "mode '$MODE' builds with MUSETRIC_PUBLISH=$publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - id: version
        env:
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          declared=$(node -p "require('./packages/app/package.json').version")
          if [ "$MODE" != release ]; then
            echo "version=$declared-dev.g${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$declared" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "not a release version: $declared" >&2
            exit 1
          fi
          case "$declared" in
            *-dev.*)
              echo "dev builds cannot be released: $declared" >&2
              exit 1
              ;;
          esac
          published=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')
          if [ -n "$published" ] && [ "$published" = "$declared" ]; then
            echo "v$declared is already released" >&2
            exit 1
          fi
          if [ -n "$published" ] && [ "$(printf '%s\n%s\n' "${published%%-*}" "${declared%%-*}" | sort -V | tail -1)" != "${declared%%-*}" ]; then
            echo "$declared is older than the published $published" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

  desktop:
    if: inputs.mode != 'testing'
    needs: prepare
    uses: ./.github/workflows/appBuildDesktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  android:
    needs: prepare
    uses: ./.github/workflows/appBuildAndroid.yml
    permissions:
      contents: read
      id-token: write
    with:
      mode: ${{ inputs.mode }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}
      version: ${{ needs.prepare.outputs.version }}

  ios:
    needs: prepare
    uses: ./.github/workflows/appBuildIos.yml
    permissions:
      contents: read
    with:
      mode: ${{ inputs.mode }}
      publish: ${{ needs.prepare.outputs.publish == 'true' }}

  release:
    if: inputs.mode == 'release'
    needs:
      - prepare
      - desktop
      - android
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: musetric-*
          merge-multiple: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node packages/app/scripts/assembleUpdateRelease.ts artifacts release ${{ needs.prepare.outputs.version }}
      - name: Copy Android and iOS artifacts into release directory
        run: |
          set -e
          mkdir -p release
          find artifacts/musetric-android -name "*.apk" -type f -exec cp -v {} release/ \;
          find artifacts/musetric-ios-* -name "*.ipa" -type f -exec cp -v {} release/ \;
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd release && sha256sum -- *) > SHA256SUMS.txt
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Musetric $VERSION" \
            --generate-notes \
            release/* SHA256SUMS.txt
