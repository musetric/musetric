name: Repo Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-quality:
    strategy:
      fail-fast: false
      matrix:
        part: [static, types, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/jsQuality
        with:
          part: ${{ matrix.part }}
  check-js-quality:
    if: always()
    needs: js-quality
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.js-quality.result }}
        run: |
          echo "the parts of the JS checks: $RESULT"
          test "$RESULT" = success
  check-rust-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$changed" | grep -Eq '^(packages/server/|packages/app/src-tauri/|packages/app/rust-toolchain\.toml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "The pull request changes nothing the Rust checks read:"
            printf '%s\n' "$changed"
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.rust == 'true'
        uses: ./.github/actions/rustQuality
  check-base-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/baseQuality
  check-model-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - working-directory: packages/server
        run: bash -c "$(jq -r '.scripts["check:models"]' package.json)"
