name: Repo Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/jsQuality
  check-rust-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rustQuality
  check-base-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/baseQuality
  check-model-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - working-directory: packages/server
        run: bash -c "$(jq -r '.scripts["check:models"]' package.json)"
