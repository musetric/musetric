name: Base Quality
description: Duplicate-code, EditorConfig, English, notices and link checks

# jscpd and editorconfig-checker are standalone binaries, installed on PATH as
# on a developer's machine; the other checks are @musetric/checks, run from
# its source with Node's built-in modules only. Each step runs the command of
# its root script from package.json, without a Yarn install, so CI and
# `yarn check:<name>` run the same thing.
runs:
  using: composite
  steps:
    - name: Install the tools
      shell: bash
      env:
        JSCPD_VERSION: 5.1.2
        EDITORCONFIG_CHECKER_VERSION: v4.0.1
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSL "https://github.com/kucherenko/jscpd/releases/download/v$JSCPD_VERSION/jscpd-linux-x64-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP/bin" jscpd
        curl -fsSL "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/$EDITORCONFIG_CHECKER_VERSION/editorconfig-checker-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/bin" editorconfig-checker
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@v5
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Check duplicate code
      shell: bash
      run: bash -c "$(jq -r '.scripts["check:dupe"]' package.json)"
    - name: Check EditorConfig
      shell: bash
      run: bash -c "$(jq -r '.scripts["check:editorconfig"]' package.json)"
    - name: Check English
      shell: bash
      run: bash -c "$(jq -r '.scripts["check:english"]' package.json)"
    - name: Check notices
      shell: bash
      run: bash -c "$(jq -r '.scripts["check:notices"]' package.json)"
    - name: Check links
      shell: bash
      run: bash -c "$(jq -r '.scripts["check:links"]' package.json)"
