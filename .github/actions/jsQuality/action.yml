name: JS Quality
description: JS dependency, format, TypeScript, lint, and test checks, one part at a time

inputs:
  part:
    description: static (dependencies, unused code, format, translations, comments), types (TypeScript, and the frontend build with the notices of its packages), lint or test
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setupPnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
    - run: rustup toolchain install --no-self-update
      shell: bash
      working-directory: packages/server
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/server
        shared-key: dsp
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: ./.github/actions/buildDsp
    - if: inputs.part == 'static'
      run: |
        pnpm check:deps:security
        pnpm check:deps:dupe
        pnpm check:unused
        pnpm check:format
        pnpm check:translations
        pnpm check:comments
      shell: bash
    - if: inputs.part == 'types'
      run: |
        pnpm check:ts
        pnpm check:deprecated
        pnpm check:notices:packages
      shell: bash
    - if: inputs.part == 'lint'
      uses: actions/cache@v5
      with:
        path: packages/*/.eslintcache
        key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/*/eslint.config.ts', 'packages/eslint-config/src/**') }}-${{ github.sha }}
        restore-keys: |
          eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/*/eslint.config.ts', 'packages/eslint-config/src/**') }}-
    - if: inputs.part == 'lint'
      run: pnpm check:lint
      shell: bash
    - if: inputs.part == 'test'
      run: pnpm test
      shell: bash
