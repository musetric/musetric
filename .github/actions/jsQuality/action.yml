name: JS Quality
description: JS dependency, format, TypeScript, lint, and test checks

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 26.2.0
        package-manager-cache: false
    - run: npm install -g corepack@latest
      shell: bash
    - run: corepack enable
      shell: bash
    - run: corepack prepare yarn@4.17.1 --activate
      shell: bash
    - uses: actions/cache@v5
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-
    - run: yarn --immutable
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
    - uses: actions/cache@v5
      with:
        path: packages/*/.eslintcache
        key: eslint-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/*/eslint.config.ts', 'packages/eslint-config/src/**') }}-${{ github.sha }}
        restore-keys: |
          eslint-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/*/eslint.config.ts', 'packages/eslint-config/src/**') }}-
    # Temporarily disabled: npm's Bulk Advisory API is timing out upstream.
    # https://github.com/npm/cli/issues/9950
    # - run: yarn check:deps:security
    - run: yarn check:deps:dupe
      shell: bash
    - run: yarn check:unused
      shell: bash
    - run: yarn check:format
      shell: bash
    - run: yarn check:translations
      shell: bash
    - run: yarn check:openapi
      shell: bash
    - run: yarn check:ts
      shell: bash
    - run: yarn check:lint
      shell: bash
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.97.1
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/server
        shared-key: js-quality
    - run: yarn test
      shell: bash
