name: JS Quality
description: JS dependency, format, TypeScript, lint, and test checks, one part at a time

inputs:
  part:
    description: static (dependencies, unused code, format, translations, comments), types (TypeScript and the frontend build), lint or test
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setupYarn
    - uses: actions/cache@v5
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-
    - run: yarn --immutable
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL: skip
    - if: inputs.part == 'static'
      run: |
        yarn check:deps:security
        yarn check:deps:dupe
        yarn check:unused
        yarn check:format
        yarn check:translations
        yarn check:comments
      shell: bash
    - if: inputs.part == 'types'
      run: |
        yarn check:ts
        yarn workspace @musetric/app build:ui
      shell: bash
    - if: inputs.part == 'lint'
      uses: actions/cache@v5
      with:
        path: packages/*/.eslintcache
        key: eslint-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/*/eslint.config.ts', 'packages/eslint-config/src/**') }}-${{ github.sha }}
        restore-keys: |
          eslint-${{ runner.os }}-${{ hashFiles('yarn.lock', 'packages/*/eslint.config.ts', 'packages/eslint-config/src/**') }}-
    - if: inputs.part == 'lint'
      run: yarn check:lint
      shell: bash
    - if: inputs.part == 'test'
      run: yarn test
      shell: bash
