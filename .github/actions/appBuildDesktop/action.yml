name: App Build Desktop
description: Builds the desktop installers of one platform and architecture and keeps them as artifacts

inputs:
  platform:
    description: Windows, macOS or Linux
    required: true
  arch:
    description: x64 or arm64
    required: true
  rust-target:
    description: The Rust target triple
    required: true
  version:
    description: The version the installers carry
    required: true
  tauri-signing-private-key:
    description: The updater's signing key
    required: false
  tauri-signing-private-key-password:
    description: The password of the updater's signing key
    required: false

runs:
  using: composite
  steps:
    - name: Select Xcode 27.1
      if: inputs.platform == 'macOS'
      run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version
      shell: bash
    - uses: ./.github/actions/setupYarn
    - uses: actions/cache@v5
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/Yarn/Berry/cache' || '~/.yarn/berry/cache' }}
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-
    - run: yarn --immutable
      env:
        MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
        ONNXRUNTIME_NODE_INSTALL: skip
      shell: bash
    - if: inputs.platform == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      shell: bash
    - if: inputs.platform == 'Linux'
      id: rust
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' packages/app/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.platform == 'Linux'
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ steps.rust.outputs.channel }}
        targets: ${{ inputs.rust-target }}
    - if: inputs.platform != 'Linux'
      run: rustup toolchain install --no-self-update
      working-directory: packages/app
      shell: bash
    - if: inputs.platform != 'Linux'
      run: rustup target add ${{ inputs.rust-target }}
      working-directory: packages/app
      shell: bash
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/server
        shared-key: app-desktop-${{ inputs.rust-target }}
    - run: rm -rf packages/server/target/*/release/bundle packages/server/target/release/bundle 2>/dev/null
      shell: bash
    - run: yarn workspace @musetric/app pack:installer -- --target ${{ inputs.rust-target }} --version ${{ inputs.version }}
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.tauri-signing-private-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.tauri-signing-private-key-password }}
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: musetric-desktop-${{ inputs.platform }}-${{ inputs.arch }}-installer
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        path: |
          packages/server/target/**/release/bundle/nsis/*.exe
          packages/server/target/**/release/bundle/nsis/*.exe.sig
          packages/server/target/**/release/bundle/dmg/*.dmg
          packages/server/target/**/release/bundle/dmg/*.dmg.sig
          packages/server/target/**/release/bundle/macos/*.app.tar.gz
          packages/server/target/**/release/bundle/macos/*.app.tar.gz.sig
          packages/server/target/**/release/bundle/deb/*.deb
          packages/server/target/**/release/bundle/deb/*.deb.sig
    - if: inputs.platform == 'Linux'
      uses: actions/upload-artifact@v7
      with:
        name: musetric-desktop-${{ inputs.platform }}-${{ inputs.arch }}-appimage
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        path: |
          packages/server/target/**/release/bundle/appimage/*.AppImage
          packages/server/target/**/release/bundle/appimage/*.AppImage.sig
