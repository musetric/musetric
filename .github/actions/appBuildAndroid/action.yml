name: App Build Android
description: Builds the unsigned APK and App Bundle for arm64-v8a and x86_64 and keeps them as artifacts

inputs:
  version:
    description: The version the APK is named by
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setupPnpm
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v4
    - run: pnpm install --frozen-lockfile
      env:
        MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
        ONNXRUNTIME_NODE_INSTALL: skip
      shell: bash
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          packages/server/target
        key: cargo-${{ runner.os }}-android-${{ hashFiles('packages/server/rust-toolchain.toml', 'packages/server/Cargo.lock', 'packages/app/src-tauri/gen/android/Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-android-
    - name: Init Android project
      working-directory: packages/app
      run: pnpm init:android
      shell: bash
    - name: Pin Android SDK path for gradle
      run: echo "sdk.dir=$ANDROID_HOME" > packages/app/src-tauri/gen/android/local.properties
      shell: bash
    - name: Restore the files the Rust build writes into the Android project
      id: generated
      uses: actions/cache@v5
      with:
        path: |
          packages/app/src-tauri/gen/android/app/src/main/java/com/musetric/client/generated
          packages/app/src-tauri/gen/android/tauri.settings.gradle
          packages/app/src-tauri/gen/android/app/tauri.build.gradle.kts
        key: android-generated-${{ runner.os }}-${{ hashFiles('packages/server/rust-toolchain.toml', 'packages/server/Cargo.lock') }}
    - name: Date the restored files before any cached build
      if: steps.generated.outputs.cache-hit == 'true'
      working-directory: packages/app/src-tauri/gen/android
      run: |
        find app/src/main/java/com/musetric/client/generated tauri.settings.gradle app/tauri.build.gradle.kts \
          -type f -exec touch -d '2000-01-01 00:00:00' {} +
      shell: bash
    - uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('packages/app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'packages/app/src-tauri/gen/android/**/*.gradle.kts', '!packages/app/src-tauri/gen/android/app/tauri.build.gradle.kts', 'packages/app/src-tauri/gen/android/gradle.properties') }}
        restore-keys: gradle-${{ runner.os }}-
    - name: Build the release APK and App Bundle (unsigned)
      working-directory: packages/app
      run: |
        version_code=$((1000 + GITHUB_RUN_NUMBER))
        pnpm build:android --aab --target aarch64 x86_64 --config "{\"bundle\":{\"android\":{\"versionCode\":$version_code}}}"
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
      shell: bash
    - name: Name the APK by version
      run: |
        cd packages/app/src-tauri/gen/android/app/build/outputs/apk/universal/release
        mv app-universal-release*.apk "Musetric_${{ inputs.version }}.apk"
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: musetric-android
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        path: packages/app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
    - uses: actions/upload-artifact@v7
      with:
        name: musetric-android-bundle
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
        path: packages/app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
