name: Rust Quality
description: Rust ast, format, clippy, and test checks

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 26.2.0
        package-manager-cache: false
    - run: npm install -g corepack@latest
      shell: bash
    - run: corepack enable
      shell: bash
    - run: corepack prepare yarn@4.17.1 --activate
      shell: bash
    - uses: actions/cache@v5
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-
    - run: yarn --immutable
      shell: bash
      env:
        MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
        ONNXRUNTIME_NODE_INSTALL: skip
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.97.1
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/server
        shared-key: rust-quality
    - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: libgtk-3-dev libwebkit2gtk-4.1-dev
        version: 1.0
    - run: yarn build:mobile
      shell: bash
    - run: yarn workspace @musetric/server check:rust:ast
      shell: bash
    - run: yarn workspace @musetric/server check:rust:fmt
      shell: bash
    - run: yarn workspace @musetric/server check:rust:clippy
      shell: bash
    - run: yarn workspace @musetric/server check:rust:test
      shell: bash
