name: Rust Quality
description: Rust ast, format, clippy, and test checks

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setupPnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        MUSETRIC_SKIP_PLAYWRIGHT_INSTALL: true
        ONNXRUNTIME_NODE_INSTALL: skip
    - run: rustup toolchain install --no-self-update
      shell: bash
      working-directory: packages/server
    - run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      shell: bash
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/server
        shared-key: rust-quality
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      shell: bash
    - run: pnpm --filter @musetric/app build:ui
      shell: bash
    - run: pnpm --filter @musetric/server check:rust:ast
      shell: bash
    - run: pnpm --filter @musetric/server check:rust:fmt
      shell: bash
    - run: pnpm --filter @musetric/server check:rust:clippy
      shell: bash
    - run: pnpm --filter @musetric/server check:rust:test
      shell: bash
