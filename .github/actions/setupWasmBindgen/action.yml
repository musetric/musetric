name: Setup wasm-bindgen
description: The Rust toolchain of packages/server with its WebAssembly target, and wasm-bindgen with its test runner at the version Cargo.lock locks

runs:
  using: composite
  steps:
    - run: rustup toolchain install --no-self-update
      shell: bash
      working-directory: packages/server
    - id: wasm-bindgen
      run: echo "version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: packages/server
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
