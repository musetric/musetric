name: Setup Yarn
description: Node from .node-version, and Yarn from packageManager through corepack

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - run: npm install -g corepack@0.36.0 --force
      shell: bash
    - run: corepack enable
      shell: bash
    - run: corepack install
      shell: bash
