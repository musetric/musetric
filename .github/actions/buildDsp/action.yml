name: Build DSP
description: The Rust toolchain of packages/server with its WebAssembly target, wasm-bindgen at the version Cargo.lock locks, and @musetric/dsp built into packages/dsp/dist

inputs:
  script:
    description: The script of @musetric/dsp that builds it, build:app for the modules the app imports
    default: build:project

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setupWasmBindgen
    - run: pnpm --filter @musetric/dsp "$SCRIPT"
      shell: bash
      env:
        SCRIPT: ${{ inputs.script }}
