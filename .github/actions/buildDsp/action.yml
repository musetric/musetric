name: Build DSP
description: The Rust toolchain of packages/server with its WebAssembly target, wasm-bindgen at the version Cargo.lock locks, and every module of @musetric/dsp built into packages/dsp/dist

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setupWasmBindgen
    - run: pnpm --filter @musetric/dsp build:project
      shell: bash
